# pnpm 11 reads the build-script allowlist from here (no longer the package.json "pnpm" field).
allowBuilds:
  '@img/sharp-libvips-darwin-arm64': true
  '@img/sharp-libvips-darwin-x64': true
  '@img/sharp-libvips-linux-arm64': true
  '@img/sharp-libvips-linux-x64': true
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  prisma: true
  sharp: true
