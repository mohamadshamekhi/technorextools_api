name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: bitnami/mongodb:7.0
        ports: ['27017:27017']
        env:
          MONGODB_REPLICA_SET_MODE: primary
          MONGODB_REPLICA_SET_NAME: rs0
          MONGODB_REPLICA_SET_KEY: ci-replica-set-key
          ALLOW_EMPTY_PASSWORD: 'yes'
          MONGODB_ADVERTISED_HOSTNAME: localhost
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 15 --health-start-period 40s
    env:
      DATABASE_URL: mongodb://localhost:27017/abzar_test?replicaSet=rs0
      JWT_SECRET: ci-only-secret-value-at-least-32-characters
      RUN_E2E: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:push
      - run: pnpm test:e2e
