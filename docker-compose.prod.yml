# Production stack for abzar/api on a single Ubuntu host.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Nginx runs on the HOST (not here) and reverse-proxies https://<domain> to
# 127.0.0.1:4000. Mongo and Redis are NOT published to the host — they are only
# reachable on the internal `abzar` network.
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    networks: [abzar]
    healthcheck:
      # Self-initiates the single-node replica set on first start. The member host
      # must be `mongo:27017` so the api container can reach it after discovery.
      test: >-
        mongosh --quiet --eval "
          try { rs.status().ok }
          catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }
        "
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    networks: [abzar]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    env_file: .env.production
    ports:
      # Bound to loopback only — the public entry point is host nginx.
      - '127.0.0.1:4000:4000'
    networks: [abzar]
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot: `prisma db push` + seed. Needs dev deps (seed runs through ts-node),
  # so it builds the `tooling` stage instead of `runtime`.
  #   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate
  migrate:
    build:
      context: .
      target: tooling
    profiles: ['tools']
    env_file: .env.production
    networks: [abzar]
    depends_on:
      mongo:
        condition: service_healthy
    command: ['sh', '-c', 'pnpm prisma:push && pnpm prisma:seed']

networks:
  abzar:

volumes:
  mongo-data:
