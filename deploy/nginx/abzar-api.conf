# /etc/nginx/sites-available/abzar-api
# Reverse proxy for abzar/api. Replace api.technorextools.com with the real host.
# certbot rewrites this file to add the TLS server block + redirect.

server {
    listen 80;
    listen [::]:80;
    server_name api.technorextools.com;

    # Media uploads go through POST /api/v1/backoffice/media/upload (<= 50 MB).
    client_max_body_size 55m;

    # Uploads and the S3 presigned PUT can be slow on Iranian links.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    access_log /var/log/nginx/abzar-api.access.log;
    error_log  /var/log/nginx/abzar-api.error.log;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API trusts exactly one proxy hop for rate-limiting by client IP.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    location = /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }
}
