# CI/CD for abzar/api (GitLab — origin is gitlab.com/technorextools/api).
#
#   verify : typecheck / lint / format:check / build / test      (every push & MR)
#   e2e    : RUN_E2E=1 against a single-node mongo replica set   (every push & MR)
#   deploy : ssh to the prod host and run deploy/deploy.sh       (main, MANUAL)
#
# Required CI/CD variables for `deploy` (Settings → CI/CD → Variables):
#   SSH_PRIVATE_KEY   (type: File)  private key whose public half is in the deploy user's authorized_keys
#   SSH_KNOWN_HOSTS   (type: File)  output of `ssh-keyscan <host>` — pins the host key
#   DEPLOY_HOST                     e.g. api.technorextools.com  (or the IP)
#   DEPLOY_USER                     e.g. deploy
#   DEPLOY_PATH                     e.g. /home/deploy/abzar-api
#   DEPLOY_SEED       (optional)    set to "1" to run `prisma db push` + seed after a schema change

stages: [verify, deploy]

default:
  image: node:22.13.0-bookworm-slim
  interruptible: true

variables:
  # Services must resolve each other by alias (the replica-set member host is `mongo:27017`).
  FF_NETWORK_PER_BUILD: 'true'
  PNPM_HOME: /root/.pnpm
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

.node:
  before_script:
    # openssl + ca-certificates are required by Prisma's query engine.
    - apt-get update -y && apt-get install -y --no-install-recommends openssl ca-certificates
    - corepack enable && corepack prepare --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

verify:
  stage: verify
  extends: .node
  script:
    - pnpm typecheck
    - pnpm lint
    - pnpm format:check
    - pnpm build
    - pnpm test

e2e:
  stage: verify
  extends: .node
  services:
    - name: mongo:7.0
      alias: mongo
      # mongod + self-initiated single-node replica set. The member host must be
      # `mongo:27017` so the job container can reach it after topology discovery.
      entrypoint:
        - sh
        - -c
        - >-
          mongod --replSet rs0 --bind_ip_all &
          until mongosh --quiet --eval 'db.adminCommand({ ping: 1 })' >/dev/null 2>&1; do sleep 1; done;
          mongosh --quiet --eval "try { rs.status().ok } catch { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }";
          wait
  variables:
    DATABASE_URL: 'mongodb://mongo:27017/abzar_test?replicaSet=rs0'
    JWT_SECRET: 'ci-only-secret-value-at-least-32-characters'
    RUN_E2E: '1'
  script:
    - pnpm prisma:push
    - pnpm test:e2e

deploy:
  stage: deploy
  image: alpine:3.20
  interruptible: false
  environment:
    name: production
    url: https://$DEPLOY_HOST
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache openssh-client
    - install -m 700 -d ~/.ssh
    - install -m 600 "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
    - install -m 644 "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    # deploy.sh does: git pull --ff-only, compose build, infra up, [migrate], api up, health wait.
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<EOSSH
      set -euo pipefail
      cd "$DEPLOY_PATH"
      git fetch --prune origin
      git checkout "$CI_DEFAULT_BRANCH"
      git reset --hard "$CI_COMMIT_SHA"
      SKIP_GIT_PULL=1 bash deploy/deploy.sh ${DEPLOY_SEED:+--seed}
      EOSSH
